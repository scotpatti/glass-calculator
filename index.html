<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A glassmorphic calculator with history, memory and scientific functions."
    />
    <title>Glass Calculator</title>
    <script>
      // Apply a saved theme before first paint so the page never flashes the wrong one.
      try {
        var saved = localStorage.getItem('glass-calculator:theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
